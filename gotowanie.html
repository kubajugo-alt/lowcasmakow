<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tryb gotowania — Ślimaki w szarym sosie — Łowca Smaków</title>
<meta name="theme-color" content="#121212">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="cook">
<main class="cook-shell">
  <div class="cook-top">
    <a href="/przepisy/slimaki-w-szarym-sosie.html" aria-label="Zamknij tryb gotowania" data-close>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <a href="/" class="logo"><img src="/img/wordmark-white.svg" alt="Łowca Smaków — strona główna" width="105" height="32"></a>
    <p class="wake" data-wake hidden>
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
      Ekran nie wygaśnie</p>
  </div>

  <div>
    <p class="cook-step" data-count>Krok 1 z 6</p>
    <div class="bars" aria-hidden="true" data-bars></div>
  </div>

  <h1 data-title aria-live="polite"></h1>
  <p class="cook-desc" data-desc></p>

  <div data-uses-wrap>
    <p class="uses-label">W tym kroku</p>
    <div class="chips" data-uses></div>
  </div>

  <button type="button" class="cook-timer" data-timer hidden>
    <span class="l">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg>
      <span data-timer-label>Uruchom minutnik</span></span>
    <span class="t" data-timer-time>[XX:00]</span>
  </button>

  <div class="cook-nav">
    <button type="button" class="cook-prev" data-prev>← Wstecz</button>
    <button type="button" class="cook-next" data-next>Dalej →</button>
  </div>
</main>

<script src="/js/recipe-data.js"></script>
<script src="/js/recipes.js"></script>
<script src="/js/cook.js"></script>
</body>
</html>
