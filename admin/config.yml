      - { label: 'Kolejność', name: order, widget: number, value_type: int, min: 1 }
      - { label: 'Lead', name: lead, widget: text }
      - { label: 'Zdjęcie', name: image, widget: object, collapsed: false, fields: *image_fields }
      - { label: 'Czas trwania', name: duration, widget: string, hint: 'np. „11 dni”' }
      - { label: 'Wielkość grupy', name: group, widget: string, required: false }
      - { label: 'Cena od (zł)', name: price, widget: number, value_type: int, min: 0 }
      - { label: 'Dopisek do ceny', name: price_note, widget: string, required: false, hint: 'np. „za osobę w pokoju dwuosobowym, bez przelotu”' }
      - label: 'Terminy'
        name: dates
        widget: list
        summary: '{{fields.date}} – {{fields.end}}'
        fields:
          - { label: 'Od', name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
          - { label: 'Do', name: end, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, picker_utc: true }
          - { label: 'Dopisek', name: note, widget: string, required: false }
      - label: 'Plan wyprawy'
        name: itinerary
        widget: list
        summary: '{{fields.title}}'
        fields:
          - { label: 'Etap', name: title, widget: string, hint: 'np. „Dni 3–4: Puebla”' }
          - { label: 'Opis', name: text, widget: text, required: false }
      - { label: 'W cenie', name: includes, widget: list, field: { label: 'Pozycja', name: item, widget: string } }
      - { label: 'Poza ceną', name: excludes, widget: list, required: false, field: { label: 'Pozycja', name: item, widget: string } }
      - label: 'Opis'
        name: body
        widget: list
        label_singular: 'blok'
        typeKey: type
        types: *blocks
      - { label: 'Poczytaj przed wyjazdem', name: related, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, required: false }

  # ------------------------------------------------------------------ shop
  - name: products
    label: 'Sklep: mieszanki przypraw'
    label_singular: 'Mieszanka'
    description: 'Produkty w sklepie. Koszyk i płatności obsługuje Snipcart: zamówienia, stany magazynowe, wysyłka i podatki są w panelu Snipcart (app.snipcart.com). Cena tutaj musi się zgadzać z tym, co widzi klient; Snipcart sprawdza ją na stronie produktu.'
    folder: content/products
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} · {{price}} zł'
    sortable_fields: [order, title, price]
    view_groups: [{ label: Kategoria, field: category }]
    editor: { preview: false }
    fields:
      - { label: 'Nazwa', name: title, widget: string, hint: 'Krótka, np. „Staropolska”. Adres strony powstaje z nazwy i nie powinien się później zmieniać (to też identyfikator produktu w Snipcart).' }
      - { label: 'Podtytuł', name: subtitle, widget: string, required: false, hint: 'Główne składniki, np. „Pieprz, szafran, imbir”' }
      - { label: 'Kolejność', name: order, widget: number, value_type: int, min: 1, hint: 'Mniejsza liczba = wyżej; 4 pierwsze są na stronie głównej.' }
      - label: 'Kategoria'
        name: category
        widget: select
        options:
          - { label: 'Kuchnia polska', value: polska }
          - { label: 'Kuchnie świata', value: swiat }
          - { label: 'Do kiszenia', value: kiszenie }
      - { label: 'Pochodzenie', name: origin, widget: string, required: false, hint: 'np. „Meksyk, Jalisco” albo „Kuchnia staropolska”' }
      - { label: 'Plakietka', name: badge, widget: string, required: false, hint: 'np. „Nowość”, „Polecamy”, „Edycja limitowana”' }
      - { label: 'Cena (zł)', name: price, widget: number, value_type: float, min: 0, step: 0.5, hint: 'Cena najmniejszego opakowania.' }
      - label: 'Opakowania'
        name: sizes
        widget: list
        summary: '{{fields.label}} (+{{fields.price_delta}} zł)'
        hint: 'Pierwsze jest domyślne. Dopłata jest doliczana do ceny; waga (z opakowaniem) służy do liczenia wysyłki.'
        fields:
          - { label: 'Nazwa', name: label, widget: string, hint: 'np. „Słoik 90 g”' }
          - { label: 'Dopłata (zł)', name: price_delta, widget: number, value_type: float, min: 0, step: 0.5, default: 0 }
          - { label: 'Waga do wysyłki (g)', name: weight, widget: number, value_type: int, min: 1 }
      - { label: 'Ostrość (0–3)', name: heat, widget: number, value_type: int, min: 0, max: 3, default: 0 }
      - { label: 'Dostępna', name: available, widget: boolean, default: true, hint: 'Wyłącz, gdy chwilowo brak. (Stany magazynowe można też prowadzić w Snipcart.)' }
      - { label: 'Opis krótki', name: lead, widget: text, hint: '1–2 zdania: na stronie produktu i w koszyku.' }
      - { label: 'Zdjęcie', name: image, widget: object, collapsed: false, fields: *image_fields }
      - { label: 'Skład', name: ingredients, widget: text }
      - { label: 'Jak używać', name: use, widget: text, required: false }
      - label: 'Historia (opcjonalnie)'
        name: body
        widget: list
        required: false
        label_singular: 'blok'
        typeKey: type
        types: *blocks
      - { label: 'Pasuje do przepisów', name: recipes, widget: relation, collection: recipes, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, required: false, hint: 'Produkt pojawi się na stronie tych przepisów z przyciskiem „Do koszyka”.' }
      - { label: 'Powiązane historie', name: articles, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, required: false }

  # ------------------------------------------------------------------ homepage
  - name: settings
    label: 'Strona główna'
    description: 'Co i w jakiej kolejności pokazuje strona główna.'
    editor: { preview: false }
    files:
      - name: sklep
        label: 'Sklep: ustawienia'
        file: content/settings/sklep.json
        format: json
        fields:
          - { label: 'Klucz Snipcart (Public API Key)', name: snipcart_key, widget: string, required: false, hint: 'Z panelu Snipcart: Account → API Keys → Public API key. To klucz publiczny, można go tu wkleić. Puste = sklep pokazuje produkty, ale przyciski mówią „Wkrótce w sprzedaży”.' }
          - { label: 'Wstęp', name: intro, widget: text }
          - { label: 'Informacja o wysyłce', name: shipping, widget: string, hint: 'Krótko; same stawki ustawia się w Snipcart (Store configuration → Shipping).' }
          - { label: 'Komunikat, gdy sklep jeszcze nie działa', name: notice, widget: string }
      - name: oferta
        label: 'Warsztaty i wyprawy (teksty)'
        file: content/settings/oferta.json
        format: json
        fields:
          - { label: 'Wstęp na stronie głównej (warsztaty i wyprawy razem)', name: home_intro, widget: text, required: false }
          - { label: 'Wstęp: warsztaty', name: workshops_intro, widget: text }
          - { label: 'Wstęp: wyprawy', name: trips_intro, widget: text }
          - { label: 'Na zamówienie: warsztaty', name: workshops_custom, widget: text }
          - { label: 'Na zamówienie: wyprawy', name: trips_custom, widget: text }
      - name: home
        label: 'Strona główna'
        file: content/settings/home.json
        format: json
        fields:
          - { label: 'Hasło na pasku', name: tagline, widget: string }
          - label: 'Historia tygodnia'
            name: lead
            widget: object
            fields:
              - { label: 'Artykuł', name: article, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title] }
              - { label: 'Tekst pod tytułem', name: text, widget: text, required: false, hint: 'Puste = lead artykułu.' }
              - { label: 'Przycisk „Przejdź do przepisu”', name: recipe, widget: relation, collection: recipes, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false }
          - { label: 'Obok historii tygodnia (dwie)', name: issue_list, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, max: 2, hint: 'Dwie historie w mozaice obok historii tygodnia.' }
          - label: 'Nowe w tym tygodniu'
            name: week
            widget: list
            summary: '{{fields.day}} {{fields.date}}'
            max: 3
            fields:
              - { label: 'Dzień', name: day, widget: select, options: ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'] }
              - { label: 'Data (opcjonalnie)', name: date, widget: string, required: false, hint: 'Puste = data artykułu, np. 27.10' }
              - { label: 'Artykuł', name: article, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title] }
          - label: 'Pas „Kuchnia staropolska”'
            name: old_polish
            widget: object
            collapsed: true
            fields:
              - { label: 'Tytuł pasa', name: title, widget: string }
              - { label: 'Główny materiał', name: feature, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title] }
              - { label: 'Nadtytuł głównego materiału', name: feature_label, widget: string }
              - { label: 'Artykuły z boku', name: side_articles, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, max: 3 }
              - { label: 'Przepis z boku', name: side_recipe, widget: relation, collection: recipes, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false }
              - { label: 'Tytuł przepisu z boku', name: side_recipe_title, widget: string, required: false }
          - label: 'Smaki regionów'
            name: regions
            widget: object
            collapsed: true
            fields:
              - { label: 'Wstęp', name: intro, widget: text }
              - label: 'Opublikowane regiony'
                name: stories
                widget: list
                summary: '{{fields.region}}: {{fields.label}}'
                fields:
                  - { label: 'Województwo', name: region, widget: select, options: ['Dolnośląskie', 'Kujawsko-pomorskie', 'Lubelskie', 'Lubuskie', 'Łódzkie', 'Małopolskie', 'Mazowieckie', 'Opolskie', 'Podkarpackie', 'Podlaskie', 'Pomorskie', 'Śląskie', 'Świętokrzyskie', 'Warmińsko-mazurskie', 'Wielkopolskie', 'Zachodniopomorskie'] }
                  - { label: 'Artykuł', name: article, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title] }
                  - { label: 'Krótki opis na mapie', name: label, widget: string }
          - label: 'Smaki świata (mapa)'
            name: world
            widget: object
            collapsed: true
            fields:
              - { label: 'Wstęp', name: intro, widget: text }
              - label: 'Kraje z historiami'
                name: stories
                widget: list
                summary: '{{fields.country}}: {{fields.label}}'
                hint: 'Jeden wpis na historię lub przepis; kraj może mieć ich kilka. Kraj z wpisem jest wyróżniony na mapie.'
                fields:
                  - { label: 'Kraj', name: country, widget: select, options: *countries }
                  - { label: 'Artykuł', name: article, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false }
                  - { label: 'albo przepis', name: recipe, widget: relation, collection: recipes, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false }
                  - { label: 'Krótki opis na mapie', name: label, widget: string }
          - { label: 'Przepisy (kolejność na pasku)', name: recipes, widget: relation, collection: recipes, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true }
          - { label: 'Z podróży', name: travel, widget: relation, collection: articles, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, max: 3 }
          - label: 'Newsletter'
            name: newsletter
            widget: object
            collapsed: true
            fields:
              - { label: 'Tekst', name: text, widget: text }
