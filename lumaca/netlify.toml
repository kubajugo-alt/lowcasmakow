# Lumaca: a separate Netlify project built from the lumaca/ folder of this repository.
# When linking the repository in Netlify, set Base directory = lumaca; build command and publish directory are below.
[build]
  publish = "."
  # Rebuilds the pages from content/ (what the CMS edits). Standard-library Python only.
  command = "python3 scripts/build.py"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Addresses of the old WordPress shop at lumaca.eco → the new pages (for when the domain moves here)
[[redirects]]
  from = "/en/our-kitchen/*"
  to = "/en/our-story/:splat"
  status = 301

[[redirects]]
  from = "/en/our-kitchen"
  to = "/en/our-story/"
  status = 301

